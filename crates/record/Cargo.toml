[package]
name = "botsim-record"
description = "Recording of a botsim run (JSON Lines): line types, writer and reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
botsim-core = { path = "../core" }
botsim-model = { path = "../model" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
# (the tests translate between VDA 5050 and the simulator's messages)
botsim-link = { path = "../link" }
botsim-vda = { path = "../vda" }
vdma-lif = "0.1.0"
vda5050 = "0.1.0"
