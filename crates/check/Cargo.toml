[package]
name = "botsim-check"
description = "Static checks of a LIF layout for a given mixed robot fleet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
botsim-model = { path = "../model" }
botsim-scenario = { path = "../scenario" }
botsim-record = { path = "../record" }
botsim-space = { path = "../space" }
aabb = "0.8.0"
togo = "0.8.0"
vda5050 = "0.1.0"
vdma-lif = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
