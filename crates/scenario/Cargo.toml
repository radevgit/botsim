[package]
name = "botsim-scenario"
description = "The scenario file (TOML) of a botsim run: types, loading and building the world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
botsim-model = { path = "../model" }
botsim-sim = { path = "../sim" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.2"
vda5050 = "0.1.0"
vdma-lif = "0.1.0"
