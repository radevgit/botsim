[package]
name = "botsim"
description = "Scenario files, CLI and reports for the botsim simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
botsim-baseline = { path = "../baseline" }
botsim-core = { path = "../core" }
botsim-record = { path = "../record" }
botsim-scenario = { path = "../scenario" }
botsim-sweep = { path = "../sweep" }
botsim-traffic = { path = "../traffic" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.2"
vda5050 = "0.1.0"
vdma-lif = "0.1.0"
