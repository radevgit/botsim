[package]
name = "botsim"
description = "Command line of botsim: runs a scenario, connecting the fleet server and the simulator, and prints a JSON summary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
botsim-baseline = { path = "../baseline" }
botsim-dispatcher = { path = "../dispatcher" }
botsim-link = { path = "../link" }
botsim-model = { path = "../model" }
botsim-record = { path = "../record" }
# (recording the server's inputs, and replaying them)
botsim-replay = { path = "../replay" }
botsim-scenario = { path = "../scenario" }
botsim-server = { path = "../server" }
botsim-sim = { path = "../sim" }
botsim-space = { path = "../space" }
# (the site's zone set message, and the route through VDA 5050)
botsim-vda = { path = "../vda" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.2"
vda5050 = "0.1.0"
vdma-lif = "0.1.0"
