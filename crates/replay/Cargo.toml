[package]
name = "botsim-replay"
description = "Records the inputs of the botsim fleet server to a file and replays them, comparing a checksum per cycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["radevgit"]

[dependencies]
botsim-baseline = { path = "../baseline" }
botsim-dispatcher = { path = "../dispatcher" }
botsim-link = { path = "../link" }
botsim-model = { path = "../model" }
botsim-server = { path = "../server" }
botsim-space = { path = "../space" }
# (the layout in a recording is read as the layout of a run is: floats exactly)
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
vda5050 = "0.1.0"
vdma-lif = "0.1.0"

[dev-dependencies]
botsim-link = { path = "../link" }
