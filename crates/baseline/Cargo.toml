[package]
name = "botsim-baseline"
description = "Bundled baseline fleet controller for the botsim simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
botsim-dispatcher = { path = "../dispatcher" }
botsim-link = { path = "../link" }
botsim-model = { path = "../model" }
botsim-router = { path = "../router" }
# (the factsheets of the setup)
vda5050 = "0.1.0"

[dev-dependencies]
botsim-bridge = { path = "../bridge" }
botsim-core = { path = "../core" }
# (the tests translate between VDA 5050 and the controller's messages)
botsim-vda = { path = "../vda" }
serde_json = "1.0.154"
vdma-lif = "0.1.0"
