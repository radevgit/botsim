# A bigger example: a one-way grid warehouse (48 aisle nodes, 8 bay sidings,
# 98 directed edges), 12 robots, goods-in bays on the west side and goods-out bays
# on the east side, rack and shelf blocks between the aisles. Traffic is busy but
# flows (see warehouse_rush.toml for the same warehouse with so many robots that
# it jams). The layout and the geometry are generated by
#   cargo run -p botsim-export --example gen_warehouse
#
# Run, record and make a video from the repository root:
# (data/ is not in git; 2700 frames of 1920x1080, about 80 s to draw, a 90 s video)
#   cargo run --release -p botsim -- --record data/warehouse.jsonl \
#       --geometry scenarios/warehouse.geometry.json scenarios/warehouse.toml
#   cargo run --release -p botsim-export -- data/warehouse.jsonl data/warehouse_frames --speed 10
#   ffmpeg -framerate 30 -i data/warehouse_frames/frame_%06d.png -c:v libx264 -preset slow -crf 18 \
#     -vf "scale=out_color_matrix=bt709:out_range=tv,format=yuv420p" -colorspace bt709 \
#     -movflags +faststart data/warehouse.mp4
name = "warehouse"
seed = 15                     # the first job comes within a second, no deadlock
duration = 900.0              # simulated seconds (15 minutes)
time_step = 0.05
start_time = 2026-11-21T10:00:00Z
lif = "warehouse.lif.json"
deadlock_timeout = 20.0       # seconds a waiting cycle must last (default 30)

[[robot]]
manufacturer = "ACME"
serial_prefix = "R"           # R-001 ... R-012
factsheet = "diff_robot.factsheet.json"
# one robot per entry, spread over the inner aisles
start_nodes = [
    "R1C2", "R1C3", "R1C4", "R1C5",
    "R2C2", "R2C3", "R2C4", "R2C5",
    "R3C2", "R3C3", "R3C4", "R3C5",
]
action_time = 1.0

[robot.action_times]
pick = 5.0
drop = 5.0

[jobs]
rate_per_hour = 200.0
# goods in (W) and goods out (E) bays: most jobs cross the whole warehouse
nodes = ["W1", "W2", "W3", "W4", "E1", "E2", "E3", "E4"]

[disturbances]
enabled = true
speed_variation = 0.05
action_variation = 0.2
stops_per_hour = 12.0
stop_seconds_min = 5.0
stop_seconds_max = 15.0
