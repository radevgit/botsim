# The big warehouse (240 m x 140 m): 90 robots of five types, jobs between
# shelf, rack and bay stations. THIS FILE IS GENERATED (with the layout and the
# geometry) by
#   cargo run --release -p botsim-export --example gen_warehouse4
# so change the fleet there (the node numbers change with the layout).
#
# Robot types (see the factsheets): X1 carrier, Y2 forklift, T3 three-wheel,
# O4 omnidirectional, C5 small. The forklift and the three-wheel robot may not use
# the narrow roads (the labyrinths and the lanes along the walls); the others may.
# The three-wheel robots cannot turn on the spot: they start where the road runs east.
#
# A 10 minute video (1920x1080, 30 fps, 18000 frames) from the repository root; the
# run is 6000 simulated seconds, shown at speed 10
name = "warehouse4"
seed = 29
duration = 6000.0
time_step = 0.05
start_time = 2026-11-22T10:00:00Z
lif = "warehouse4.lif.json"
deadlock_timeout = 20.0
# route with load: each other robot on an edge (or at the node it ends at) makes the
# edge 5 m longer for the route, so that the empty parallel lane is preferred
route_load_weight = 5.0

[[robot]]
manufacturer = "ACME"
serial_prefix = "Y"
factsheet = "forklift.factsheet.json"
start_nodes = [
    "N466", "N699", "N555", "N500", "N445", "N534", "N568", "N513",
    "N547", "N492", "N437", "N560", "N649", "N505", "N539", "N484",
    "N429", "N552", "N497", "N442", "N531", "N476", "N544", "N633",
]
# each robot faces along the road that leaves its start node
start_heading = "road"
action_time = 1.0

[robot.action_times]
pick = 8.0
drop = 8.0

