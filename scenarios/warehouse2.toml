# The big warehouse (240 m x 140 m): 14 robots of five types, jobs between 69 shelf,
# rack and bay stations. The layout and the geometry are generated by
#   cargo run --release -p botsim-export --example gen_warehouse2
#
# Robot types (see the factsheets): X1 carrier, Y2 forklift, T3 three-wheel,
# O4 omnidirectional, C5 small. The forklift and the three-wheel robot may not use
# the narrow roads (the labyrinths and the lanes along the walls); the others may.
#
# A 3 minute video (1920x1080, 30 fps, 5400 frames) from the repository root; the
# run is 1800 simulated seconds, shown at speed 10 (data/ is not in git):
#   cargo run --release -p botsim-runner -- --record data/warehouse2.jsonl --record-interval 0.25 \
#       --geometry scenarios/warehouse2.geometry.json scenarios/warehouse2.toml
#   cargo run --release -p botsim-export -- data/warehouse2.jsonl data/warehouse2_frames --speed 10
#   ffmpeg -framerate 30 -i data/warehouse2_frames/frame_%06d.png -c:v libx264 -preset slow -crf 18 \
#     -vf "scale=out_color_matrix=bt709:out_range=tv,format=yuv420p" -colorspace bt709 \
#     -movflags +faststart data/warehouse2.mp4
name = "warehouse2"
seed = 29                     # first robot drives at 17 s, 10 robots busy by 104 s; no collision or deadlock
duration = 1800.0
time_step = 0.05
start_time = 2026-11-22T10:00:00Z
lif = "warehouse2.lif.json"
deadlock_timeout = 20.0

# three forklifts, on the ring road
[[robot]]
manufacturer = "ACME"
serial_prefix = "Y"
factsheet = "forklift.factsheet.json"
start_nodes = ["N036", "N095", "N005"]
action_time = 1.0

[robot.action_times]
pick = 8.0
drop = 8.0

# four carriers
[[robot]]
manufacturer = "ACME"
serial_prefix = "X"
factsheet = "diff_robot.factsheet.json"
start_nodes = ["N029", "N424", "N012", "N086"]
action_time = 1.0

[robot.action_times]
pick = 5.0
drop = 5.0

# two three-wheel robots
[[robot]]
manufacturer = "ACME"
serial_prefix = "T"
factsheet = "three_wheel.factsheet.json"
start_nodes = ["N109", "N037"]
action_time = 1.0

[robot.action_times]
pick = 6.0
drop = 6.0

# two omnidirectional robots
[[robot]]
manufacturer = "ACME"
serial_prefix = "O"
factsheet = "omni_robot.factsheet.json"
start_nodes = ["N000", "N015"]
action_time = 1.0

[robot.action_times]
pick = 4.0
drop = 4.0

# three small robots
[[robot]]
manufacturer = "ACME"
serial_prefix = "C"
factsheet = "small_robot.factsheet.json"
start_nodes = ["N374", "N080", "N028"]
action_time = 1.0

[robot.action_times]
pick = 3.0
drop = 3.0

[jobs]
rate_per_hour = 150.0
# every station but the parking
stations = [
    "LN0", "LN1", "LN2", "LN3", "LN4", "LN5", "LN6",
    "LV0", "LV1", "LV2", "LV3", "LV4", "LV5",
    "GOODS-IN-1", "GOODS-IN-2", "GOODS-IN-3", "GOODS-IN-4", "GOODS-IN-5",
    "GOODS-OUT-1", "GOODS-OUT-2", "GOODS-OUT-3",
    "RW00", "RW01", "RW02", "RW04", "RW05", "RW06",
    "RW10", "RW11", "RW12", "RW13", "RW14", "RW15", "RW16",
    "RW20", "RW21", "RW22", "RW23", "RW25", "RW26",
    "RW30", "RW31", "RW32", "RW33", "RW34", "RW35", "RW36",
    "RE00", "RE01", "RE02", "RE03", "RE04",
    "RE10", "RE11", "RE12", "RE13", "RE14",
    "RE20", "RE21", "RE22", "RE23", "RE24",
    "RE30", "RE31", "RE32", "RE33", "RE34",
    "WALL-S", "WALL-N",
]

[disturbances]
enabled = true
speed_variation = 0.05
action_variation = 0.2
stops_per_hour = 12.0
stop_seconds_min = 5.0
stop_seconds_max = 15.0
